services:
  benchmark:
    build: .
    volumes:
      - ./benchmarks:/app/benchmarks
      - ./data:/app/data
    command: python -m credit_truth.evaluate --out /app/benchmarks/results.json
  jupyter:
    build: .
    ports:
      - "8888:8888"
    volumes:
      - ./:/app
    command: jupyter notebook --ip=0.0.0.0 --port=8888 --no-browser --allow-root --token=credit-truth
